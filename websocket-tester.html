<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket</title>
</head>
<style>
    .container {
        background-color: black;
        color: rgb(103, 255, 103);
        padding: 5%;
        height: 50vh;
        width: 90%;
        text-align: left;
        word-wrap: break-word;
        font-family: 'Courier New', Courier, monospace;
        font-size: 12px;
        overflow: scroll;
    }
</style>
<body>
    <div class="container" id="container">
        test
    </div>
</body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.0/socket.io.min.js"></script>
<script>
    const socket = io("ws://127.0.0.1:3001/Markets", {
        transports: ['websocket'],
    });
    // client-side
    socket.on("connect", () => {
        console.log(socket.id); // x8WIv7-mJelg7on_ALbx
    });

    socket.on('eventx', msg => {
        const msgx = typeof msg == 'object' ? JSON.stringify(msg) : msg
        const docx = document.getElementById('container')
        docx.innerHTML += `<br/><br/><br/>Recieved (${typeof msg}): ` + msgx
        docx.scrollTop = docx.scrollHeight - docx.clientHeight
    })

    socket.emit('eventx', 'data')

    socket.on("connect_error", () => {
        console.log("Error"); // x8WIv7-mJelg7on_ALbx
    });
</script>
</html>
